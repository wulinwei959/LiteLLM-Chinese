[[IgnoredVulns]]
id = "GHSA-w8v5-vhqr-4h9v"
ignoreUntil = 2027-01-31
reason = "diskcache still has no fixed release (5.6.3 remains the newest as of 2026-11-02); reached only through the optional caching extra, which neither the proxy image nor the PyPI proxy extra installs; the advisory's own vector requires attacker write access to the local cache directory plus a victim read; drop once upstream ships a fix"

[[PackageOverrides]]
name = "@azure/msal-node"
version = "6.0.1"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2027-01-15
reason = "dev-only transitive of the vscode extension, pinned ^6.0.0 by @azure tooling that has no v7-compatible release yet; forcing 7.x across a major breaks the parent; drop once the parent ships ^7"
