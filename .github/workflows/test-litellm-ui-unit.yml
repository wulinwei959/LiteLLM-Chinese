name: UI Unit Tests
permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches:
      - main
      - "litellm_**"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ui/litellm-dashboard

    steps:
      - name: Checkout repository
        uses: ./.github/actions/vendor/checkout
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          category: ui

      - name: Setup Node.js
        if: steps.changes.outputs.decision != 'skip'
        uses: ./.github/actions/vendor/setup-node
        with:
          node-version-file: ui/litellm-dashboard/.nvmrc
          cache: "npm"
          cache-dependency-path: ui/litellm-dashboard/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.decision != 'skip'
        run: npm ci

      - name: Run UI type tests (Vitest)
        if: steps.changes.outputs.decision != 'skip'
        env:
          CI: "true"
        run: npm run test:types

      - name: Run UI unit tests (Vitest)
        if: steps.changes.outputs.decision != 'skip'
        env:
          CI: "true"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          full_suite() { npm run test -- --run --pool forks --maxWorkers=4; }

          if [ -z "$BASE_SHA" ]; then
            echo "Push to $GITHUB_REF_NAME: running the full suite"
            full_suite
            exit 0
          fi

          git fetch --no-tags --depth=200 origin "$BASE_SHA" "$HEAD_SHA"
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$BASE_SHA")
          changed_files=()
          while IFS= read -r f; do
            changed_files+=("$f")
          done < <(git diff --name-only --relative "$merge_base" "$HEAD_SHA" -- .)
          if [ ${#changed_files[@]} -eq 0 ]; then
            echo "No UI files changed in this PR; skipping unit tests."
            exit 0
          fi

          scope=$(printf '%s\n' "${changed_files[@]}" | bash "$GITHUB_WORKSPACE/.github/scripts/select_ui_test_scope.sh")
          if [ "$scope" != related ]; then
            echo "Pull request: ${#changed_files[@]} changed UI files reach outside src/, so related would miss their dependents; running the full suite"
            full_suite
            exit 0
          fi

          echo "Pull request: running tests related to ${#changed_files[@]} changed UI files"
          npm run test -- related "${changed_files[@]}" --run --passWithNoTests \
            --pool forks --maxWorkers=4
