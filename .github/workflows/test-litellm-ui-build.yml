name: UI Build Check
permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches:
      - main
      - "litellm_**"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          category: ui

      - name: Setup Node.js
        if: steps.changes.outputs.decision != 'skip'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ui/litellm-dashboard/.nvmrc
          cache: "npm"
          cache-dependency-path: ui/litellm-dashboard/package-lock.json

      # The job container has no Docker daemon, so the stage is mirrored in a
      # scratch directory instead of built. Copying the dashboard tree alone is
      # the property the stage enforces: an import reaching above the dashboard
      # root resolves in a checkout and fails in every image we ship. Dockerfile,
      # docker/Dockerfile.non_root and ui/Dockerfile share this stage verbatim.
      - name: Build the dashboard as the shipped images build it
        if: steps.changes.outputs.decision != 'skip'
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          npm_config_fund: "false"
          npm_config_audit: "false"
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -a ui/litellm-dashboard/. "$work/"
          cd "$work"
          npm ci --prefer-offline
          npm run build
