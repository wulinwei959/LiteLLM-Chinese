name: "Set up uv with retries"
description: >-
  Install uv from the package index, retrying the install so a transient index
  failure gets fresh attempts. The upstream setup-uv action resolves its
  release manifest from raw.githubusercontent.com, which this LAN runner cannot
  reach reliably.

inputs:
  version:
    description: "uv version to install"
    required: true

runs:
  using: composite
  steps:
    - name: Point uv at the reachable package mirror
      shell: bash
      run: |
        lock="${GITHUB_WORKSPACE:-$PWD}/uv.lock"
        if [ -f "$lock" ]; then
          sed -i \
            -e 's#https://files.pythonhosted.org#https://pypi.tuna.tsinghua.edu.cn#g' \
            -e 's#https://pypi.org/simple#https://pypi.tuna.tsinghua.edu.cn/simple#g' \
            "$lock"
        fi
        {
          echo "UV_CACHE_DIR=$HOME/.cache/uv"
          echo "UV_DEFAULT_INDEX=https://pypi.tuna.tsinghua.edu.cn/simple"
        } >> "$GITHUB_ENV"

    - name: Restore the uv download cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        # uv stores every wheel it fetches here, content-addressed. Warming it once
        # lets later jobs build their venv from local files instead of re-downloading
        # from files.pythonhosted.org on the LAN runner. actions/cache saves this back
        # at the end of the job, after the caller's `uv sync` has populated it.
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install uv (attempt 1)
      id: attempt-1
      continue-on-error: true
      shell: bash
      run: python3 -m pip install --index-url https://pypi.tuna.tsinghua.edu.cn/simple "uv==${{ inputs.version }}"

    - name: Wait before attempt 2
      if: steps.attempt-1.outcome == 'failure'
      shell: bash
      run: sleep 15

    - name: Install uv (attempt 2)
      id: attempt-2
      if: steps.attempt-1.outcome == 'failure'
      continue-on-error: true
      shell: bash
      run: python3 -m pip install --index-url https://pypi.tuna.tsinghua.edu.cn/simple "uv==${{ inputs.version }}"

    - name: Wait before attempt 3
      if: steps.attempt-2.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Install uv (attempt 3)
      if: steps.attempt-2.outcome == 'failure'
      shell: bash
      run: python3 -m pip install --index-url https://pypi.tuna.tsinghua.edu.cn/simple "uv==${{ inputs.version }}"
